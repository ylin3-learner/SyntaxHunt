<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">Fixed-sentence MORPH interaction illustration</title>
  <desc id="desc">A fixed sentence with one highlighted verb. Clicking the verb opens form choices; there is no timeline, word bank, or sentence assembly area.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#f5f4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#213653" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1120" height="600" rx="28" fill="url(#background)"/>
  <rect x="34" y="30" width="1052" height="540" rx="24" fill="#fff" filter="url(#shadow)"/>
  <path d="M34 112h1052" stroke="#edf1f6"/>
  <text x="68" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#22364d">MORPH · 動詞形式</text>
  <rect x="68" y="142" width="984" height="68" rx="16" fill="#fff9df"/>
  <text x="96" y="184" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#695a24">句子順序已固定；點擊唯一的紫色目標字詞，選擇符合文法考點的形式。</text>

  <rect x="92" y="230" width="936" height="150" rx="22" fill="#f8faff" stroke="#e0e7f2"/>
  <text x="132" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600" fill="#526879">The boy</text>
  <rect x="292" y="268" width="150" height="62" rx="14" fill="#f5eefe" stroke="#a36ac7" stroke-width="2"/>
  <text x="315" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#7d3cb5">went</text>
  <path d="M408 295l9 9 15-18" fill="none" stroke="#7d3cb5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="600" fill="#526879">home yesterday.</text>

  <rect x="292" y="338" width="150" height="104" rx="15" fill="#fff" stroke="#d8c4ed" filter="url(#shadow)"/>
  <rect x="302" y="348" width="130" height="36" rx="9" fill="#f5eefe"/>
  <text x="322" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#7d3cb5">went</text>
  <text x="322" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#526879">go</text>
  <text x="92" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#8997a4">介面示意圖：一次只練習一個變形目標；無時間軸、字塊庫或組句空格。</text>
</svg>
