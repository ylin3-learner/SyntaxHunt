  <text x="841" y="595" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">檢查答案　➜</text>
  <text x="93" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#8997a4">介面示意圖：時態 MORPH 題型；實際畫面依題目概念與 UI 模式切換。</text>
