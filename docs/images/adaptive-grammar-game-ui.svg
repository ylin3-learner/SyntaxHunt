<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">SyntaxHunt adaptive grammar game UI illustration</title>
  <desc id="desc">Illustrative student game screen showing progress, a tense timeline, grammar chunks, answer slots, and feedback controls.</desc>
  <defs>
